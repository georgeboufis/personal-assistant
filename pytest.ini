[pytest]
# Πού βρίσκονται τα tests.
testpaths = tests

# -q: συνοπτική έξοδος (μία τελεία ανά test αντί για μία γραμμή).
# --strict-markers: αν γράψεις marker με τυπογραφικό, σκάει αντί να
#     τον αγνοήσει σιωπηλά.
# -ra: στο τέλος δείχνει σύνοψη για ό,τι δεν πέρασε.
addopts = -q --strict-markers -ra

# Τα warnings να είναι ορατά, ώστε να πιάνουμε deprecations έγκαιρα
# (π.χ. όταν αναβαθμίζουμε langchain/langgraph).
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
